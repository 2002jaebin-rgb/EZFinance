<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EZFinance - 초보자를 위한 기업 재무 요약</title>
  <meta name="description" content="누구나 쉽게 볼 수 있는 기업 재무 요약 서비스, EZFinance" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS v2 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 font-sans">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <header class="py-5 md:py-6">
      <div class="flex items-center justify-between">
        <a href="/" class="text-xl md:text-2xl font-bold tracking-tight">EZFinance</a>
      </div>
    </header>

    <!-- Main -->
    <main class="pb-12 md:pb-16">
      <!-- Hero Search (유일한 검색창) -->
      <section class="pt-4 md:pt-6">
        <div class="max-w-xl mx-auto">
          <h1 class="sr-only">EZ재무 - 검색</h1>
          <div class="relative">
            <label for="search" class="sr-only">기업명 또는 종목코드 입력</label>
            <input id="search" type="text" inputmode="search"
              placeholder="기업명 또는 종목코드 입력"
              class="w-full rounded-2xl border border-neutral-200 bg-white px-5 py-3.5 shadow-sm
                     focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900"
              autocomplete="off" />
            <div id="autocomplete"
              class="absolute left-0 right-0 mt-2 hidden overflow-hidden rounded-2xl border
                     border-neutral-200 bg-white shadow-lg">
              <ul id="autocomplete-list" class="divide-y divide-neutral-100"></ul>
            </div>
          </div>
          <!-- 검색 버튼 -->
          <div class="mt-3 text-right">
            <button id="searchBtn" type="button"
              class="inline-flex items-center justify-center rounded-xl bg-neutral-900 text-white
                     px-5 py-2.5 text-sm font-medium shadow-sm hover:bg-neutral-800
                     active:bg-neutral-900 focus:outline-none">
              검색
            </button>
          </div>
        </div>
      </section>

      <!-- DART API 테스트 버튼 -->
      <div class="max-w-xl mx-auto mt-4 text-center">
        <button id="testApiBtn"
          class="px-4 py-2 rounded bg-blue-600 text-white text-sm">
          DART API 테스트
        </button>
      </div>

      <!-- Popular Companies -->
      <section class="mt-8 md:mt-12">
        <h2 class="text-lg md:text-xl font-semibold tracking-tight mb-3">인기 종목</h2>
        <div class="flex flex-wrap gap-2.5" id="popular">
          <button class="px-3.5 py-2 rounded-full border border-neutral-200 bg-white
                         hover:border-neutral-300 hover:bg-neutral-50 text-sm shadow-sm transition"
                  data-name="삼성전자">삼성전자</button>
          <button class="px-3.5 py-2 rounded-full border border-neutral-200 bg-white
                         hover:border-neutral-300 hover:bg-neutral-50 text-sm shadow-sm transition"
                  data-name="카카오">카카오</button>
          <button class="px-3.5 py-2 rounded-full border border-neutral-200 bg-white
                         hover:border-neutral-300 hover:bg-neutral-50 text-sm shadow-sm transition"
                  data-name="현대차">현대차</button>
          <button class="px-3.5 py-2 rounded-full border border-neutral-200 bg-white
                         hover:border-neutral-300 hover:bg-neutral-50 text-sm shadow-sm transition"
                  data-name="POSCO홀딩스">POSCO홀딩스</button>
          <button class="px-3.5 py-2 rounded-full border border-neutral-200 bg-white
                         hover:border-neutral-300 hover:bg-neutral-50 text-sm shadow-sm transition"
                  data-name="NAVER">NAVER</button>
          <button class="px-3.5 py-2 rounded-full border border-neutral-200 bg-white
                         hover:border-neutral-300 hover:bg-neutral-50 text-sm shadow-sm transition"
                  data-name="LG화학">LG화학</button>
        </div>
      </section>

      <!-- Explanation -->
      <section class="mt-8 md:mt-10">
        <p class="text-neutral-600 text-[15px] md:text-base">
          누구나 쉽게 볼 수 있는 기업 재무 요약 서비스입니다.
        </p>
      </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-200 py-6 text-center">
      <p class="text-xs text-neutral-500">본 서비스는 OPENDART 공공 API를 활용합니다.</p>
    </footer>
  </div>

  <!-- App Script (Supabase 검색 + Fallback + 인기종목 이동 + Test) -->
  <script>
  (function() {
    // TODO: 아래 2개 값을 본인 Supabase 프로젝트 정보로 교체
    const SUPABASE_URL = "https://ruvcwkghdommvbzhshtl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1dmN3a2doZG9tbXZiemhzaHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5MTAyMzQsImV4cCI6MjA3NDQ4NjIzNH0.71Sn9Qu_cOfUmPNSfBSRmuFoaqCzUU7yU6zmwotJnyY";

    // Supabase 클라이언트 (익명키 사용: 읽기 전용)
    let supabaseClient = null;
    try {
      if (SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(e) {
      console.warn("Supabase 초기화 실패:", e);
    }

    const input = document.getElementById('search');
    const dropdown = document.getElementById('autocomplete');
    const list = document.getElementById('autocomplete-list');
    const searchBtn = document.getElementById('searchBtn');

    // Fallback 데이터 (Supabase 실패 시)
    const fallback = [
      { name: "삼성전자", stock_code: "005930", corp_code: "00126380" },
      { name: "카카오", stock_code: "035720", corp_code: "00139042" },
      { name: "현대차", stock_code: "005380", corp_code: "00164742" },
      { name: "POSCO홀딩스", stock_code: "005490", corp_code: "00126361" },
      { name: "NAVER", stock_code: "035420", corp_code: "00129090" },
      { name: "LG화학", stock_code: "051910", corp_code: "00164779" }
    ];

    async function supabaseSearch(q) {
      if (!supabaseClient || !q) return [];
      // v2 쿼리: or 필터로 name/stock_code 동시 검색
      // 참고: name.ilike.%q%,stock_code.ilike.%q%
      const orFilter = `name.ilike.%${q}%,stock_code.ilike.%${q}%`;
      const { data, error } = await supabaseClient
        .from("corpmap")
        .select("corp_code, stock_code, name")
        .or(orFilter)
        .limit(10);

      if (error) {
        console.warn("Supabase 검색 에러:", error);
        return [];
      }
      return data || [];
    }

    // 필요 시 로컬 corpmap.json도 사용 (Supabase 실패/네트워크 이슈 대비)
    async function localSearch(q) {
      const res = await fetch('/data/corpmap.json', { cache: 'no-store' }).catch(() => null);
      let mapping = Array.isArray(fallback) ? fallback : [];
      if (res && res.ok) {
        try { mapping = await res.json(); } catch {}
      }
      const s = (q || '').trim().toLowerCase();
      if (!s) return [];
      return mapping.filter(m =>
        (m.name || '').toLowerCase().includes(s) ||
        (m.stock_code || '').includes(q)
      ).slice(0, 10);
    }

    async function search(q) {
      // 1) Supabase 우선
      const sb = await supabaseSearch(q);
      if (sb && sb.length) return sb;
      // 2) 실패하면 로컬 fallback
      return localSearch(q);
    }

    function render(items) {
      list.innerHTML = '';
      if (!items.length) { dropdown.classList.add('hidden'); return; }
      dropdown.classList.remove('hidden');
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-neutral-50';
        li.innerHTML = `
          <div class="flex flex-col">
            <span class="text-sm font-medium text-neutral-900">${item.name}</span>
            <span class="text-xs text-neutral-500">${item.stock_code || '-'} · corp:${item.corp_code}</span>
          </div>`;
        li.addEventListener('mousedown', (e) => {
          e.preventDefault();
          window.location.href = `company.html?corp=${item.corp_code}`;
        });
        list.appendChild(li);
      });
    }

    // 이벤트
    input.addEventListener('input', async (e) => {
      const q = e.target.value;
      const items = await search(q);
      render(items);
    });
    input.addEventListener('compositionend', async (e) => {
      const items = await search(e.target.value);
      render(items);
    });
    document.addEventListener('click', (e) => {
      if (!dropdown.contains(e.target) && e.target !== input) {
        dropdown.classList.add('hidden');
      }
    });
    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const results = await search(input.value);
        if (results.length > 0) {
          window.location.href = `company.html?corp=${results[0].corp_code}`;
        }
      }
    });
    searchBtn.addEventListener('click', async () => {
      const results = await search(input.value);
      if (results.length > 0) {
        window.location.href = `company.html?corp=${results[0].corp_code}`;
      } else {
        alert('검색 결과가 없습니다. (예: 삼성전자, 005930)');
      }
    });

    // 인기 종목 클릭 → Supabase에서 corp_code 찾고 이동 (fallback 포함)
    const popular = document.getElementById('popular');
    if (popular) {
      popular.querySelectorAll('button[data-name]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const name = btn.getAttribute('data-name');
          let hit = null;
          if (supabaseClient) {
            const { data } = await supabaseClient
              .from("corpmap").select("corp_code,name").eq("name", name).limit(1);
            hit = (data && data[0]) || null;
          }
          if (!hit) {
            hit = fallback.find(m => m.name === name) || null;
          }
          if (hit) window.location.href = `company.html?corp=${hit.corp_code}`;
          else alert('매핑에서 회사를 찾을 수 없습니다.');
        });
      });
    }

    // Test 버튼 (그대로 유지)
    document.getElementById("testApiBtn").addEventListener("click", async () => {
      const res = await fetch(`/api/financials?corp=00126380&year=2023`);
      const data = await res.json();
      console.log("API 응답:", data);
      alert("API 호출 완료! 콘솔(F12)에서 확인하세요.");
    });
  })();
  </script>
</body>
</html>
