<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZFinance - 초보자를 위한 기업 재무 요약</title>
  <meta name="description" content="누구나 쉽게 볼 수 있는 기업 재무 요약 서비스, EZFinance">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 font-sans">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <header class="py-5 md:py-6">
      <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-3 md:gap-4">
        <div class="flex items-center md:justify-start justify-center">
          <a href="#" class="text-xl md:text-2xl font-bold tracking-tight">EZFinance</a>
        </div>
        <div class="order-2 md:order-none">
          <form class="w-full" action="#" method="get">
            <label for="q" class="sr-only">기업명 또는 종목코드 입력</label>
            <input id="q" name="q" type="text" inputmode="search" placeholder="기업명 또는 종목코드 입력" class="w-full rounded-xl border border-neutral-200 bg-white px-4 py-2.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900" />
          </form>
        </div>
        <div class="flex md:justify-end justify-center">
          <button type="submit" form="" class="inline-flex items-center justify-center rounded-xl bg-neutral-900 text-white px-5 py-2.5 text-sm font-medium shadow-sm hover:bg-neutral-800 active:bg-neutral-900 focus:outline-none">검색</button>
        </div>
      </div>
    </header>

    <!-- Main Body -->
    <main class="pb-12 md:pb-16">
      <!-- Hero: Search -->
      <section class="pt-4 md:pt-6">
        <div class="max-w-xl mx-auto">
          <h1 class="sr-only">EZ재무 - 검색</h1>
          <div class="relative">
            <label for="hero-search" class="sr-only">기업명 또는 종목코드 입력</label>
            <input id="hero-search" type="text" inputmode="search" placeholder="기업명 또는 종목코드 입력" class="w-full rounded-2xl border border-neutral-200 bg-white px-5 py-3.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900" autocomplete="off" />
            <div id="autocomplete" class="absolute left-0 right-0 mt-2 hidden overflow-hidden rounded-2xl border border-neutral-200 bg-white shadow-lg">
              <ul id="autocomplete-list" class="divide-y divide-neutral-100"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- ✅ DART API 테스트 버튼 -->
      <div class="max-w-xl mx-auto mt-4 text-center">
        <button id="testApiBtn" class="px-4 py-2 rounded bg-blue-600 text-white text-sm">
          DART API 테스트
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-200 py-6 text-center">
      <p class="text-xs text-neutral-500">본 서비스는 OPENDART 공공 API를 활용합니다.</p>
    </footer>
  </div>

  <!-- JS -->
  <script>
    document.getElementById("testApiBtn").addEventListener("click", async () => {
      const res = await fetch(`/api/financials?corp=00126380&year=2023`);
      const data = await res.json();
      console.log("API 응답:", data);
      alert("API 호출 완료! 콘솔(F12) 확인하세요.");
    });
  </script>
</body>
</html>
