<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>기업 상세 - EZFinance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="container mx-auto p-6">
    <!-- 상단 헤더 -->
    <header class="mb-6">
      <h1 id="company-name" class="text-3xl font-bold">기업 상세</h1>
      <p id="company-code" class="text-gray-600"></p>
    </header>

    <!-- ✅ 기업 기본 정보 섹션 (추후 /api/company 연결 예정) -->
    <section id="company-info" class="mb-8">
      <h2 class="text-xl font-bold mb-4">기업 개요</h2>
      <div id="company-info-container" class="bg-white p-4 rounded shadow">
        <p>기업 기본 정보가 여기에 표시됩니다.</p>
      </div>
    </section>

    <!-- ✅ 재무 정보 섹션 -->
    <section id="financials" class="mt-8">
      <h2 class="text-xl font-bold mb-4">재무 정보</h2>
      <div id="financials-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- 카드 자동 추가 -->
      </div>
    </section>
  </div>

  <script>
  // 📌 숫자 포맷 함수
  function formatNumber(val) {
    if (!val) return "-";
    return Number(val.replace(/,/g, "")).toLocaleString() + " 원";
  }

  // 📌 재무정보 불러오기
  async function loadFinancials(corp) {
    const year = new Date().getFullYear() - 1;
    const res = await fetch(`/api/financials?corp=${corp}&year=${year}`);
    const data = await res.json();
    console.log("재무정보:", data);

    if (!data.summary) return;

    const container = document.getElementById("financials-container");
    container.innerHTML = "";

    for (const [key, values] of Object.entries(data.summary)) {
      const card = document.createElement("div");
      card.className = "p-4 bg-white rounded shadow";

      card.innerHTML = `
        <h3 class="font-semibold mb-2">${key}</h3>
        <table class="w-full text-sm">
          <thead>
            <tr>
              <th class="text-left">당기</th>
              <th class="text-left">전기</th>
              <th class="text-left">전전기</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>${formatNumber(values.당기)}</td>
              <td>${formatNumber(values.전기)}</td>
              <td>${formatNumber(values.전전기)}</td>
            </tr>
          </tbody>
        </table>
      `;
      container.appendChild(card);
    }
  }

  // 📌 URL에서 corp_code 추출 후 실행
  const params = new URLSearchParams(window.location.search);
  const corp = params.get("corp");
  if (corp) {
    document.getElementById("company-code").textContent = `corp_code: ${corp}`;
    loadFinancials(corp);
  }
  </script>
</body>
</html>
