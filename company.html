<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EZFinance - 기업 재무 상세</title>
	<meta name="description" content="EZFinance 기업 재무 상세 페이지">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Noto Sans", "Ubuntu", "Cantarell", "Helvetica Neue", "Arial", "\"Apple Color Emoji\"", "\"Segoe UI Emoji\"", "\"Segoe UI Symbol\""] },
					colors: {
						brand: { DEFAULT: "#111827" }
					}
				}
			}
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 font-sans selection:bg-neutral-900 selection:text-white">
	<div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-5 md:py-6">
		<!-- Top Bar -->
		<div class="flex items-center justify-between">
			<a href="/" class="inline-flex items-center gap-2 text-sm text-neutral-600 hover:text-neutral-900">
				<span class="inline-block h-5 w-5 rounded-full bg-neutral-900 text-white grid place-items-center">←</span>
				<span>홈으로</span>
			</a>
			<span class="text-sm text-neutral-500">EZFinance</span>
		</div>

		<!-- Header Info -->
		<section class="mt-6">
			<div class="flex flex-col md:flex-row md:items-end md:justify-between gap-2">
				<div>
					<h1 id="companyName" class="text-2xl md:text-3xl font-bold tracking-tight">-</h1>
					<p class="text-neutral-500 mt-1">
						<span>종목코드 </span><span id="stockCode" class="font-medium">-</span>
					</p>
				</div>
				<div class="text-neutral-600 text-sm">기준년도 <span id="fiscalYear" class="font-semibold">-</span></div>
			</div>
		</section>

		<!-- Summary Badges -->
		<section class="mt-5">
			<div id="summaryBadges" class="flex flex-wrap gap-2">
				<span class="inline-flex items-center gap-2 rounded-full bg-emerald-50 text-emerald-700 text-xs font-medium px-3 py-1 border border-emerald-200">✅ 순이익 증가</span>
				<span class="inline-flex items-center gap-2 rounded-full bg-amber-50 text-amber-700 text-xs font-medium px-3 py-1 border border-amber-200">⚠️ 부채비율 높음</span>
			</div>
		</section>

		<!-- Financial Cards -->
		<section class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<div class="text-sm text-neutral-500">매출액</div>
				<div id="revenue" class="mt-1 text-2xl font-semibold tracking-tight">-</div>
			</div>
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<div class="text-sm text-neutral-500">영업이익</div>
				<div id="operatingProfit" class="mt-1 text-2xl font-semibold tracking-tight">-</div>
			</div>
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<div class="text-sm text-neutral-500">당기순이익</div>
				<div id="netIncome" class="mt-1 text-2xl font-semibold tracking-tight">-</div>
			</div>
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<div class="text-sm text-neutral-500">자산총계</div>
				<div id="totalAssets" class="mt-1 text-2xl font-semibold tracking-tight">-</div>
			</div>
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<div class="text-sm text-neutral-500">부채총계</div>
				<div id="totalLiabilities" class="mt-1 text-2xl font-semibold tracking-tight">-</div>
			</div>
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<div class="text-sm text-neutral-500">자본금</div>
				<div id="capital" class="mt-1 text-2xl font-semibold tracking-tight">-</div>
			</div>
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<div class="text-sm text-neutral-500">부채비율</div>
				<div id="debtRatio" class="mt-1 text-2xl font-semibold tracking-tight">-</div>
			</div>
		</section>

		<!-- Chart Section -->
		<section class="mt-8">
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<h2 class="text-base font-semibold text-neutral-800">매출/순이익 추이 (3년)</h2>
				<div class="mt-4">
					<canvas id="trendChart" height="120"></canvas>
				</div>
			</div>
		</section>

		<!-- Detail Table -->
		<section class="mt-8">
			<div class="rounded-2xl border border-neutral-200 bg-white p-4">
				<h2 class="text-base font-semibold text-neutral-800">재무 요약</h2>
				<div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
					<div class="flex justify-between bg-neutral-50 rounded-xl p-3"><span class="text-neutral-500">회사명</span><span id="companyNameTable" class="font-medium">-</span></div>
					<div class="flex justify-between bg-neutral-50 rounded-xl p-3"><span class="text-neutral-500">종목코드</span><span id="stockCodeTable" class="font-medium">-</span></div>
					<div class="flex justify-between bg-neutral-50 rounded-xl p-3"><span class="text-neutral-500">기준년도</span><span id="fiscalYearTable" class="font-medium">-</span></div>
					<div class="flex justify-between bg-neutral-50 rounded-xl p-3"><span class="text-neutral-500">부채비율</span><span id="debtRatioTable" class="font-medium">-</span></div>
				</div>
			</div>
		</section>
	</div>

	<script>
		(function() {
			// Utility: format number with commas
			function formatNumber(n) {
				if (n === null || n === undefined || n === '-') return '-';
				const num = Number(n);
				if (Number.isNaN(num)) return String(n);
				return num.toLocaleString('ko-KR');
			}

			// Parse URL param: ?corp=00126380
			const params = new URLSearchParams(window.location.search);
			const corpCode = params.get('corp');

			// Placeholder: you will fetch from OPENDART with corpCode
			// For now, dummy data keyed by corp code
			const dummy = {
				'005930': {
					companyName: '삼성전자', stockCode: '005930', fiscalYear: '2024',
					revenue: 260000000000000, operatingProfit: 15000000000000, netIncome: 12000000000000,
					totalAssets: 420000000000000, totalLiabilities: 160000000000000, capital: 8975140000000,
					debtRatio: 38.1,
					trendYears: ['2022', '2023', '2024'], trendRevenue: [240, 250, 260], trendNetIncome: [8, 10, 12]
				},
				'035720': {
					companyName: '카카오', stockCode: '035720', fiscalYear: '2024',
					revenue: 15000000000000, operatingProfit: 950000000000, netIncome: 700000000000,
					totalAssets: 46000000000000, totalLiabilities: 22000000000000, capital: 4450000000000,
					debtRatio: 48.9,
					trendYears: ['2022', '2023', '2024'], trendRevenue: [13, 14, 15], trendNetIncome: [0.5, 0.6, 0.7]
				}
			};

			const data = dummy[corpCode] || {
				companyName: '-', stockCode: corpCode || '-', fiscalYear: '-',
				revenue: '-', operatingProfit: '-', netIncome: '-',
				totalAssets: '-', totalLiabilities: '-', capital: '-',
				debtRatio: '-', trendYears: ['2022','2023','2024'], trendRevenue: [0,0,0], trendNetIncome: [0,0,0]
			};

			// Fill placeholders
			document.getElementById('companyName').textContent = data.companyName;
			document.getElementById('stockCode').textContent = data.stockCode;
			document.getElementById('fiscalYear').textContent = data.fiscalYear;

			document.getElementById('revenue').textContent = formatNumber(data.revenue);
			document.getElementById('operatingProfit').textContent = formatNumber(data.operatingProfit);
			document.getElementById('netIncome').textContent = formatNumber(data.netIncome);
			document.getElementById('totalAssets').textContent = formatNumber(data.totalAssets);
			document.getElementById('totalLiabilities').textContent = formatNumber(data.totalLiabilities);
			document.getElementById('capital').textContent = formatNumber(data.capital);
			document.getElementById('debtRatio').textContent = data.debtRatio === '-' ? '-' : data.debtRatio + '%';

			document.getElementById('companyNameTable').textContent = data.companyName;
			document.getElementById('stockCodeTable').textContent = data.stockCode;
			document.getElementById('fiscalYearTable').textContent = data.fiscalYear;
			document.getElementById('debtRatioTable').textContent = document.getElementById('debtRatio').textContent;

			// Chart.js for trend
			const ctx = document.getElementById('trendChart');
			const chart = new Chart(ctx, {
				type: 'line',
				data: {
					labels: data.trendYears,
					datasets: [
						{
							label: '매출(조원)',
							data: data.trendRevenue,
							borderColor: '#111827',
							backgroundColor: 'rgba(17, 24, 39, 0.08)',
							tension: 0.25,
							fill: true,
							pointRadius: 3,
							pointBackgroundColor: '#111827'
						},
						{
							label: '순이익(조원)',
							data: data.trendNetIncome,
							borderColor: '#10b981',
							backgroundColor: 'rgba(16, 185, 129, 0.12)',
							tension: 0.25,
							fill: true,
							pointRadius: 3,
							pointBackgroundColor: '#10b981'
						}
					]
				},
				options: {
					responsive: true,
					maintainAspectRatio: true,
					scales: {
						y: {
							beginAtZero: true,
							grid: { color: 'rgba(0,0,0,0.06)' }
						},
						x: {
							grid: { display: false }
						}
					},
					plugins: {
						legend: { display: true, labels: { boxWidth: 12, usePointStyle: true } },
						tooltip: { enabled: true }
					}
				}
			});
		})();
	</script>
</body>
</html>
